name: Flutter Android build

# Reusable workflow — se invoca desde ci.yml (no corre por sí solo).
# Fase de build: valida ambos flavors en modo debug y sin secretos de firma.
on:
  workflow_call:
    inputs:
      flutter-version:
        description: Versión de Flutter a usar.
        type: string
        default: "3.41.9"

jobs:
  build:
    name: Build ${{ matrix.flavor }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: dev
            target: lib/main/main_dev.dart
          - flavor: prod
            target: lib/main/main_prod.dart

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true

      - name: Prepare .env
        run: cp .env.example .env 2>/dev/null || echo "DEVELOP_ENV=https://api-dev.zafira.com" > .env

      - name: Install deps
        run: flutter pub get

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug -t ${{ matrix.target }} --flavor ${{ matrix.flavor }}
